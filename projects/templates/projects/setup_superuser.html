<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EZR — Initial Setup</title>
<style>
  body{font-family:Arial,sans-serif;background:#1a1a1a;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;}
  .box{background:#2a2a2a;border:1px solid #444;border-radius:10px;padding:2rem;width:360px;}
  h2{margin:0 0 1.5rem;font-size:1.2rem;color:#f97316;}
  input{width:100%;padding:.6rem .8rem;margin-bottom:1rem;border:1px solid #555;border-radius:6px;background:#333;color:#fff;font-size:.95rem;box-sizing:border-box;}
  button{width:100%;padding:.7rem;background:#f97316;border:none;border-radius:6px;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;}
  .note{font-size:.78rem;color:#888;margin-top:1rem;line-height:1.5;}
</style>
</head>
<body>
<div class="box">
  <h2>⚙ EZR — Create Admin Account</h2>
  <form method="post">
    {% csrf_token %}
    <input type="email" name="email" placeholder="Your email address" required>
    <input type="password" name="password" placeholder="Choose a password" required>
    <button type="submit">Create Admin Account</button>
  </form>
  <div class="note">⚠ This page only works once — it disables itself after the first account is created.</div>
</div>
</body>
</html>
